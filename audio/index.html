<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>声の確認</title>
<style>
  body { margin: 0; background: #f6f1e7; color: #2f3a40; font-family: "Noto Sans JP", system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 22px; margin: 4px 0 8px; }
  h2 { font-size: 17px; margin: 18px 0 6px; }
  .grid { display: flex; flex-wrap: wrap; gap: 6px; }
  button { font: inherit; font-size: 15px; border: 0; border-radius: 10px; padding: 8px 10px; background: #2f7d6d; color: #fff; touch-action: manipulation; }
  button.playing { background: #e08a2e; }
  button.all { background: #4a5a63; }
  .small { font-size: 13px; color: #6b767c; }
</style>
</head>
<body>
<main>
  <h1>声の確認（冥鳴ひまり）</h1>
  <p class="small">ボタンで1つずつ、「ぜんぶ」でその段を順に再生します。読み間違い・聞きにくいものがあればファイル名を控えてください。</p>
  <div id="list"></div>
  <p class="small">音声：VOICEVOX:冥鳴ひまり</p>
</main>
<script>
const PH = { hajimeru: "はじめるよ！", pikotte: "ピコッてなったら、いってね。", mouichido: "もういちど、いってね。", button: "ボタンでこたえてね。",
  kangaeyou: "もういっかい、かんがえよう。", kazoeyou: "いっしょにかぞえよう。", iete: "こたえはいくつかな？",
  yattane: "やったね！", sugoi: "すごい！", kangaeta: "よくかんがえたね！", kazoeta: "じぶんでかぞえられたね！",
  ganbatta: "さいごまでがんばったね！", oshimai: "おしまい。", seal: "シールをどうぞ！", ashita: "きょうはここまで。またあしたね。" };
const groups = [
  ["問題（a＋b は？）", (() => { const r = []; for (let a = 0; a <= 10; a++) for (let b = 0; a + b <= 10; b++) r.push([`q/${a}_${b}`, `${a}+${b}`]); return r; })()],
  ["問題（10＋□）", Array.from({ length: 10 }, (_, i) => [`q/10_${i + 1}`, `10+${i + 1}`])],
  ["せいかい", Array.from({ length: 21 }, (_, n) => [`ok/${n}`, `${n} せいかい`])],
  ["数", Array.from({ length: 20 }, (_, i) => [`n/${i + 1}`, `${i + 1}`])],
  ["決まった言葉", Object.entries(PH).map(([k, t]) => [`p/${k}`, t])],
];
let audio = null, cur = null, token = 0;
function play(f, b) {
  return new Promise(res => {
    if (audio) { audio.pause(); cur && cur.classList.remove("playing"); }
    audio = new Audio(f + ".wav?v=" + Date.now());   // 作り直した音が古いまま鳴らないように
    cur = b; b.classList.add("playing");
    audio.onended = audio.onerror = () => { b.classList.remove("playing"); res(); };
    audio.play().catch(res);
  });
}
const list = document.getElementById("list");
for (const [title, items] of groups) {
  const h = document.createElement("h2"); h.textContent = title; list.appendChild(h);
  const g = document.createElement("div"); g.className = "grid"; list.appendChild(g);
  const all = document.createElement("button"); all.className = "all"; all.textContent = "▶ ぜんぶ"; g.appendChild(all);
  const btns = items.map(([f, label]) => {
    const b = document.createElement("button"); b.textContent = label; b.title = f;
    b.onclick = () => { token++; play(f, b); }; g.appendChild(b); return [f, b];
  });
  all.onclick = async () => { const t = ++token; for (const [f, b] of btns) { if (t !== token) break; await play(f, b); } };
}
</script>
</body>
</html>
