<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>こえを えらぼう</title>
<style>
  body { margin: 0; background: #f6f1e7; color: #2f3a40; font-family: "Noto Sans JP", system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  h1 { font-size: 24px; margin: 4px 0; }
  button { font: inherit; font-size: 24px; font-weight: 700; border: 0; border-radius: 16px; padding: 18px;
    background: #2f7d6d; color: #fff; text-align: left; display: flex; align-items: center; gap: 12px; touch-action: manipulation; }
  button.playing { background: #e08a2e; }
  .no { display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; background: #fff; color: #2f7d6d; flex: none; }
  p { margin: 0; line-height: 1.6; }
  .small { font-size: 13px; color: #6b767c; }
</style>
</head>
<body>
<main>
  <h1>こえを えらぼう</h1>
  <p>ボタンを おすと「3たす4は？ …7。せいかい！」と しゃべるよ。すきな こえは どれかな？</p>
  <div id="list"></div>
  <p class="small">音声：VOICEVOX:ずんだもん、VOICEVOX:春日部つむぎ、VOICEVOX:満別花丸、VOICEVOX:四国めたん、VOICEVOX:冥鳴ひまり、VOICEVOX:No.7、VOICEVOX:WhiteCUL</p>
  <p class="small"><a href="../">← たしざんの試作にもどる</a></p>
</main>
<script>
const V = [["zundamon","ずんだもん"],["tsumugi","春日部つむぎ"],["hanamaru","満別花丸（元気）"],["metan","四国めたん（あまあま）"],
  ["himari","冥鳴ひまり"],["no7","No.7（読み聞かせ）"],["whitecul","WhiteCUL（たのしい）"]];
const list = document.getElementById("list");
list.style.cssText = "display:flex;flex-direction:column;gap:12px";
let audio = null, cur = null;
V.forEach(([f, name], i) => {
  const b = document.createElement("button");
  b.innerHTML = `<span class="no">${i + 1}</span><span>${name}</span>`;
  b.onclick = () => {
    if (audio) { audio.pause(); cur && cur.classList.remove("playing"); }
    audio = new Audio(f + ".wav"); cur = b; b.classList.add("playing");
    audio.onended = () => b.classList.remove("playing");
    audio.play();
  };
  list.appendChild(b);
});
</script>
</body>
</html>
